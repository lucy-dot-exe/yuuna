<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Yuuna game</title>
    <style>
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0d1831;
      }
    </style>
  </head>
  <body>
    <canvas id="yuuna"></canvas>
    <script type="module" src="/src/main.ts"></script>

    <!--
      neutralino.js only exists here once `neu update` has placed it into
      app/ (see neutralino.config.json's cli.clientLibrary) — `npm run dev`
      never touches Neutralino at all, so this 404s harmlessly during
      plain browser development. It resolves once you've run
      `npm run neu:update` and `npm run build`/`npm run neu:run`.
    -->
    <script src="./neutralino.js"></script>
  </body>
</html>
