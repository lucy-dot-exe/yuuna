<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground - Yuuna</title>
    <style>
      #editorContainer {
        width: 100%;
        height: 800px;
      }

      #yuuna {
        background-color: #0d1831;
      }

      body {
        margin: 0px;
      }

      canvas {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        outline: none;
        -webkit-tap-highlight-color: rgba(255, 255, 255, 0); /* mobile webkit */
      }
    </style>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <script src="https://unpkg.com/monaco-editor@0.30.1/min/vs/loader.js"></script>
  </head>

  <script src="./bundle.js"></script>

  <body>
    <header class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
      <nav class="container">
        <a class="navbar-brand" href="#">🌙 Yuuna</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="#">Playground</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <div class="content" style="margin-inline: 10px">
      <div class="h-100 g-2 mt-1 row" style="flex-wrap: wrap-reverse">
        <div class="col-md">
          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: stretch;
              width: 100%;
              height: 100%;
            "
          >
            <div style="flex: 1 1 0%">
              <div
                style="
                  display: flex;
                  flex-direction: column;
                  align-items: stretch;
                  width: 100%;
                  height: 100%;
                "
              >
                <div
                  style="
                    display: flex;
                    flex-direction: row;
                    align-items: stretch;
                    width: 100%;
                    margin-bottom: 6px;
                  "
                >
                  <div style="margin: 5px 10px">Editor:</div>
                  <div class="hstack" style="margin-left: auto">
                    <select class="form-select form-select-sm">
                      <option value="" disabled="" hidden="">
                        Select an example...
                      </option>
                      <optgroup label="Games">
                        <option value="1">Cookie Clicker</option>
                      </optgroup>
                    </select>
                  </div>
                </div>
                <div style="flex: 1 1 0%">
                  <div id="editorContainer"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md">
          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: stretch;
              width: 100%;
              height: 100%;
            "
          >
            <div style="flex: 1 1 0%">
              <div
                style="
                  display: flex;
                  flex-direction: column;
                  align-items: stretch;
                  width: 100%;
                  height: 100%;
                "
              >
                <div
                  style="
                    display: flex;
                    flex-direction: row;
                    align-items: stretch;
                    width: 100%;
                    margin-bottom: 6px;
                  "
                >
                  <div style="margin: 5px 10px">Preview:</div>
                  <div
                    class="d-flex gap-2 align-items-center"
                    style="margin-left: auto"
                  >
                    <div class="text-nowrap form-check">
                      <input
                        type="checkbox"
                        class="form-check-input"
                        checked=""
                        onchange="onAutoReloadToggle(event.target.checked)"
                      /><label title="" class="form-check-label"
                        >Auto-Reload</label
                      >
                    </div>
                    <button
                      type="button"
                      id="autoreload-button"
                      class="btn settings bi-arrow-clockwise btn-dark"
                      style="font-size: 20px; padding: 0px 4px"
                      onclick="updatePreview()"
                    ></button>
                  </div>
                </div>

                <div style="flex: 1 1 0%">
                  <canvas
                    id="yuuna"
                    width="960px"
                    height="800px"
                    style="width: 100%; height: 800px"
                  ></canvas>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let autoReload = true;

      function onAutoReloadToggle(checked) {
        autoReload = checked;
      }

      require.config({
        paths: { vs: "https://unpkg.com/monaco-editor@0.30.1/min/vs" },
      });

      require(["vs/editor/editor.main"], function () {
        const yuunasContext = `
        declare type RectangleRenderable = {
          type: "RECTANGLE";

          position: { x: number; y: number };
          size: { width: number; height: number };
          color: string;

          id?: string;
          isClickable?: boolean;
          isHoverable?: boolean;
          trackMouseMovement?: boolean;
        };

        
        declare type CircleRenderable = {
          type: "CIRCLE";

          position: { x: number; y: number };
          radius: number;
          color: string;

          id?: string;
          isClickable?: boolean;
          isHoverable?: boolean;
          trackMouseMovement?: boolean;
        };

        declare type TextRenderable = {
          type: "TEXT";

          text: string;
          color: string;
          position: { x: number; y: number };
          align?: { x: "left" | "center" | "right"; y: "bottom" | "middle" | "top" };

          id?: string;
          isClickable?: boolean;
          isHoverable?: boolean;
          trackMouseMovement?: boolean;
        };

        declare type SpriteRenderable = {
          type: "SPRITE";

          position: { x: number; y: number };
          resourceId: string;
          frame: number;
          scale?: number;
          opacity?: number;

          id?: string;
          isClickable?: boolean;
          isHoverable?: boolean;
          trackMouseMovement?: boolean;
        };

        declare type Renderable =
          | RectangleRenderable
          | CircleRenderable
          | SpriteRenderable
          | TextRenderable;

       
        declare type TimeEvent = { tag: "TIME"; delta: number };

        declare type ClickEvent = {
          tag: "CLICK";
          id?: string;
          mouse: { x: number; y: number };
        };

        declare type HoverInEvent = {
          tag: "HOVER_IN";
          id?: string;
          mouse: { x: number; y: number };
        };

        declare type HoverOutEvent = {
          tag: "HOVER_OUT";
          id?: string;
          mouse: { x: number; y: number };
        };

        declare type MouseMoveEvent = {
          tag: "MOUSE_MOVE";
          id?: string;
          mouse: { x: number; y: number };
        };

        declare type GameEvent =
          | TimeEvent
          | ClickEvent
          | HoverInEvent
          | HoverOutEvent
          | MouseMoveEvent;

          
        declare type NextStateProps<State> = {
          state: State;
          event: GameEvent;
          keyboard: Record<
            KeyboardKeys,
            {
              isPressed: boolean;
              isJustPressed: boolean;
              isJustReleased: boolean;
            }
          >;
        };

        declare type RunEngineProps<State> = {
          initialState: State;
          render: (state: State) => {
            cursor?: "default" | "pointer";
            renderables: Renderable[];
          };
          nextState: (props: NextStateProps<State>) => State;
          resources?: Record<
            string,
            {
              src: string;
              size: { width: number; height: number };
              slices: { vertical: number; horizontal: number };
            }
          >;
        };

        declare type RunEngineFunction = <State>(
          props: RunEngineProps<State>
        ) => Promise<void>;

        declare const keyboardKeys = [
          "ControlLeft",
          "ControlRight",
          "AltLeft",
          "AltRight",
          "CapsLock",

          "End",
          "Delete",
          "Tab",
          "Space",
          "Enter",

          "ArrowLeft",
          "ArrowRight",
          "ArrowUp",
          "ArrowDown",

          "Numpad0",
          "Numpad1",
          "Numpad2",
          "Numpad3",
          "Numpad4",
          "Numpad5",
          "Numpad6",
          "Numpad7",
          "Numpad8",
          "Numpad9",

          "Digit0",
          "Digit1",
          "Digit2",
          "Digit3",
          "Digit4",
          "Digit5",
          "Digit6",
          "Digit7",
          "Digit8",
          "Digit9",

          "KeyA",
          "KeyB",
          "KeyC",
          "KeyD",
          "KeyE",
          "KeyF",
          "KeyG",
          "KeyH",
          "KeyI",
          "KeyJ",
          "KeyK",
          "KeyL",
          "KeyM",
          "KeyN",
          "KeyO",
          "KeyP",
          "KeyQ",
          "KeyR",
          "KeyS",
          "KeyT",
          "KeyU",
          "KeyV",
          "KeyW",
          "KeyX",
          "KeyY",
          "KeyZ",
        ] as const;

        declare type KeyboardKeys = (typeof keyboardKeys)[number];
        declare type KeyboardState = Record<KeyboardKeys, boolean>;

        declare var Yuuna: {
          runEngine: RunEngineFunction;
        };

            `;

        const yuunasContextModel = monaco.editor.createModel(
          yuunasContext,
          "typescript",
          monaco.Uri.parse("inmemory://model/yuunasContext.d.ts")
        );

        window.editor = monaco.editor.create(
          document.getElementById("editorContainer"),
          {
            value: `
// Cookie clicker

// Create a type for the state of your game
type GameState = { cookies: number };

// Create the initial state
const initialState: GameState = {
  cookies: 0,
};

// Create a function that renders the game, based on the state
type RenderFunction = (state: GameState) => { renderables: Renderable[] };
const render: RenderFunction = (state) => {
  return {
    renderables: [
      // Renders a text display for the number of cookies
      {
        type: "TEXT",
        text: \`\${state.cookies} cookies\`,
        color: "black",

        position: {
          x: 100,
          y: 50,
        },

        align: {
          x: "left",
          y: "middle",
        },
      },

      // Renders a cookie: a clickable brown circle
      {
        type: "CIRCLE",
        color: "brown",

        isClickable: true,
        id: "cookie",

        position: {
          x: 50,
          y: 50,
        },
        radius: 25,
      },
    ],
  };
};

// Create a function that handles the game state
// Ask youself: "given the current game state, if an event happens, what should the next state be?"
type NextStateFunction = (props: {
  state: GameState;
  event: GameEvent;
}) => GameState;

const nextState: NextStateFunction = (props) => {
  // If the event is a "cookie is clicked" event
  if (props.event.tag === "CLICK" && props.event.id === "cookie") {
    return {
      // Sums 1 in the cookies counter
      cookies: props.state.cookies + 1,
    };
  }

  // Else, state remains unchanged
  return props.state;
};

// Runs the engine
Yuuna.runEngine<GameState>({
  initialState,
  nextState,
  render,
});



            `.trim(),
            language: "typescript",
            theme: "vs-dark",
            automaticLayout: true,
          }
        );

        monaco.languages.typescript.typescriptDefaults.addExtraLib(
          yuunasContext,
          "inmemory://model/yuunasContext.d.ts"
        );

        window.editor.onDidChangeModelContent(() => {
          if (!autoReload) {
            setAutoReloadButtonState(true);
            return;
          }

          updatePreview();
        });

        updatePreview();
      });

      function setAutoReloadButtonState(state) {
        const button = document.getElementById("autoreload-button");

        if (state) {
          button.classList.remove("btn-dark");
          button.classList.add("btn-primary");
        } else {
          button.classList.add("btn-dark");
          button.classList.remove("btn-primary");
        }
      }

      function updatePreview() {
        setAutoReloadButtonState(false);

        monaco.languages.typescript.getTypeScriptWorker().then((worker) => {
          const uri = window.editor.getModel().uri;

          worker(uri).then((client) =>
            client.getEmitOutput(uri.toString()).then((result) => {
              const compiledCode = result.outputFiles[0].text;

              try {
                eval(compiledCode);
              } catch (error) {
                console.error("Error running the compiled code:", error);
              }
            })
          );
        });
      }

      function updateCanvasRatio() {
        const canvas = document.getElementById("yuuna");
        canvas.height = canvas.clientHeight;
        canvas.width = canvas.clientWidth;
      }

      updateCanvasRatio();
      window.onresize = updateCanvasRatio;
    </script>
  </body>
</html>
